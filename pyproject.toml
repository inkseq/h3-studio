[tool.ruff]
required-version = "==0.17.0"
target-version = "py312"
line-length = 88
include = ["platform_app.py", "studio_platform/**/*.py", "tests/**/*.py"]
# The repository's private-folder allowlist also matches nine tracked modules.
# The finite source scope above, rather than that legacy ignore list, is used.
respect-gitignore = false
# This evaluator is also a protected installed host helper. Keep its bytes.
extend-exclude = ["studio_platform/alert_conditions.py"]
force-exclude = true
unsafe-fixes = false

[tool.ruff.lint]
# Fatal diagnostics remain blocking; tools/check_maintainability.py ratchets debt.
select = ["E9", "F63", "F7", "F82", "F401", "F841", "B", "C901", "S608"]
fixable = []

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.per-file-ignores]
# This ratchet covers backend modules. Test files retain the original fatal gate.
"tests/**/*.py" = ["F401", "F841", "B", "C901", "S608"]

[tool.ruff.format]
quote-style = "preserve"
line-ending = "lf"
docstring-code-format = false

[tool.coverage.run]
source = ["studio_platform", "platform_app"]
relative_files = true
parallel = true

[tool.coverage.report]
fail_under = 0
show_missing = true
