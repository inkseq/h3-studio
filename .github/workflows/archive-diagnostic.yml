name: Verify Docker archive compatibility
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONPATH: ${{ github.workspace }}/tests
jobs:
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Inspect synthetic GPU overlay rendering (no daemon changes or credentials)
        run: |
          python - <<'PY'
          import json
          from test_platform_gpu_acceptance import ComposeOverlayTests, fixture_diagnostics
          ComposeOverlayTests.setUpClass()
          print(json.dumps(fixture_diagnostics(ComposeOverlayTests.config, ComposeOverlayTests.version), indent=2))
          PY
          python -m unittest test_platform_gpu_acceptance -v
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build and inspect a synthetic archive (no app or credentials)
        run: |
          mkdir archive-fixture
          printf 'synthetic public fixture\n' > archive-fixture/marker
          printf 'FROM scratch\nCOPY marker /marker\nLABEL org.opencontainers.image.revision="%s"\n' "$GITHUB_SHA" > archive-fixture/Dockerfile
          docker build -t "sixnine-platform:$GITHUB_SHA" archive-fixture
          python tools/build_platform_release.py "$GITHUB_SHA" archive-release
          python - "$GITHUB_SHA" <<'PY'
          import importlib.util,json,sys,tarfile
          from pathlib import Path
          sys.path.insert(0,str(Path('deploy/platform').resolve()))
          import release
          directory=Path('archive-release')
          with tarfile.open(directory/'image.tar.gz','r|gz') as archive:
              for member in archive:
                  if member.isfile() and member.size<20000:
                      try:
                          print(member.name,json.load(archive.extractfile(member)))
                      except (ValueError,UnicodeError):
                          print(member.name,'non-JSON layer')
          try:
              release.validate_image_archive(directory/'image.tar.gz',release.manifest(directory,sys.argv[1]))
              print('Archive validated')
          except release.ReleaseError as error:
              print('Validator error code:',str(error))
              raise SystemExit(1)
          PY
