version: 2
updates:
  - package-ecosystem: pip
    directories:
      - "/"
      - "/deploy/observability"
      - "/deploy/tls"
      - "/deploy/wangp"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
